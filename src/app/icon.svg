<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Auroka Primary Blue Gradient -->
    <linearGradient id="aurokaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Clean White Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />

  <!-- Inner Blue Brand Badge (Matching Sidebar & Navbar Logo) -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#aurokaBlue)" />

  <!-- Coins Brand Logo Emblem (Crisp White) -->
  <!-- Backing Coin -->
  <circle cx="310" cy="215" r="90" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9" />
  <path d="M255 160 A90 90 0 0 1 395 300" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.5" />

  <!-- Foreground Main Coin -->
  <circle cx="215" cy="305" r="100" fill="url(#aurokaBlue)" stroke="#ffffff" stroke-width="26" />
  <circle cx="215" cy="305" r="50" fill="none" stroke="#ffffff" stroke-width="20" />
</svg>
